name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev-http2-inbound-outbound
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - dev-http2-inbound-outbound
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Set variables
        run: |
          VERSION="${GITHUB_REF_NAME,,}-$(git rev-parse --short HEAD)"
          VERSION="${VERSION//\//-}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
        shell: bash

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go env

          if [ "${GOOS}" = "windows" ]; then
            OUT="mihomo.exe"
          else
            OUT="mihomo"
          fi

          go build -trimpath \
            -ldflags "-s -w -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}'" \
            -o "${OUT}"

          if [ "${GOOS}" = "windows" ]; then
            zip -9 "mihomo-${GOOS}-${GOARCH}-${VERSION}.zip" "${OUT}"
          else
            tar -czf "mihomo-${GOOS}-${GOARCH}-${VERSION}.tar.gz" "${OUT}"
          fi

          echo "${VERSION}" > version.txt
          find . -maxdepth 1 -type f \
            \( -name "mihomo-*.zip" -o -name "mihomo-*.tar.gz" -o -name "version.txt" \) \
            -print | sort | xargs sha256sum > checksums.txt
          cat checksums.txt
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "mihomo-${{ matrix.goos }}-${{ matrix.goarch }}"
          path: |
            mihomo-*.zip
            mihomo-*.tar.gz
            version.txt
            checksums.txt
